name: Security Reviewer Agent

on:
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: 'URL of the pull request to review'
        required: false
        type: string
      review_focus:
        description: 'Specific security areas to focus on'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    name: Security Review Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract PR information
        id: pr_info
        run: |
          if [ -n "${{ github.event.inputs.pull_request_url }}" ]; then
            PR_NUMBER=$(echo "${{ github.event.inputs.pull_request_url }}" | grep -oP '(?<=/pull/)\d+')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_url=${{ github.event.inputs.pull_request_url }}" >> $GITHUB_OUTPUT
          fi
          echo "review_focus=${{ github.event.inputs.review_focus }}" >> $GITHUB_OUTPUT
          echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT

      - name: Run security-reviewer agent via Copilot
        id: security_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create prompt file for the security reviewer agent
          cat > security-review-prompt.md << 'PROMPT'
          # Security Review Task
          
          **Repository**: ${{ steps.pr_info.outputs.repo }}
          **Branch**: ${{ steps.pr_info.outputs.branch }}
          **Review Focus**: ${{ steps.pr_info.outputs.review_focus || 'all security aspects' }}
          **PR URL**: ${{ steps.pr_info.outputs.pr_url }}
          
          Please use the security-reviewer agent (`.github/agents/security-reviewer.agent.md`) to perform a comprehensive security review of this repository.
          
          Focus on:
          1. Client-to-server trust boundaries, API routes, request parsing, response handling
          2. Authentication, authorization, access-control assumptions, privilege boundaries
          3. Input validation, output encoding, injection risks, unsafe redirects, path handling
          4. Secrets, credentials, tokens, personal data, sensitive logs, browser storage
          5. Dependencies, lockfiles, package scripts, environment configuration
          6. GitHub Actions, repository automation, shell commands, permissions
          7. Static data integrity and generic certification behavior
          
          Provide findings classified by severity:
          - HIGH: Credible and exploitable paths to material impact
          - MEDIUM: Meaningful weaknesses requiring additional conditions
          - LOW: Defense-in-depth and hardening issues
          
          Generate a structured security report with evidence, triggers, impact, and remediation.
          PROMPT
          
          echo "Security review prompt created"
          cat security-review-prompt.md
          echo ""
          echo "Review will be conducted by security-reviewer agent"

      - name: Generate security report template
        id: report
        run: |
          cat > security-report.md << 'EOF'
          # Security Review Report
          
          ## Review Details
          - **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - **Repository**: ${{ steps.pr_info.outputs.repo }}
          - **Branch**: ${{ steps.pr_info.outputs.branch }}
          - **Focus Area**: ${{ steps.pr_info.outputs.review_focus || 'All security aspects' }}
          - **Triggered By**: ${{ github.actor }}
          - **Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ## Security Reviewer Agent
          
          Agent: `.github/agents/security-reviewer.agent.md`
          
          The security-reviewer agent performs comprehensive analysis of:
          
          ### Review Scope
          - **Client-to-Server Security**: Trust boundaries, API routes, request/response handling, error exposure
          - **Authentication & Authorization**: Authentication mechanisms, privilege boundaries, access controls, administrative behavior exposure
          - **Input Handling**: Validation, output encoding, injection risks, unsafe redirects, path traversal, prototype pollution, DoS conditions
          - **Secrets & Data**: Credentials, tokens, personal data, sensitive logs, browser storage, accidental exposure
          - **Browser-Local State**: Certification-scoped data handling (ghcert.<certId>.* keys), local persistence, cross-certification leakage
          - **Dependencies**: Lockfiles, package scripts, environment configuration, known vulnerabilities
          - **GitHub Actions**: Automation security, shell commands, permissions, untrusted event data, artifact handling, workflow injection risks
          - **Static Data Integrity**: Certification data validation, attacker-controlled data handling
          
          ### Severity Classification
          
          **HIGH**: Credible and reasonably exploitable paths to material impact
          - Authentication/authorization bypass
          - Remote code execution, command injection, arbitrary file access
          - Secrets, credentials, tokens, or sensitive data exposure
          - High-impact integrity or availability failure
          
          **MEDIUM**: Meaningful weaknesses with additional conditions
          - Exploitable issues requiring privilege, user interaction, or constrained deployment
          - Limited blast radius or impact
          
          **LOW**: Defense-in-depth and hardening issues
          - Low-impact exposure or difficult-to-exploit weaknesses
          - Minor information disclosure
          - Constrained practical impact
          
          ## Findings
          
          *(Security review findings will be populated here)*
          
          ### Review Workflow
          
          The agent follows this process:
          1. Establish review target, repository baseline, and user assumptions
          2. Inspect project structure, manifests, lockfiles, scripts, workflows, environment handling
          3. Map assets, sensitive data, trust boundaries, external inputs, privileged operations
          4. Trace security-sensitive data from entry through validation, authorization, processing, storage, logging, output
          5. Inspect relevant tests and validation commands
          6. Reproduce or reason through plausible triggers (when safe)
          7. Classify findings by severity and order by impact
          8. Report checks actually run and their results
          
          ### Checks Run
          
          - [ ] Project structure and configuration analysis
          - [ ] Package manifest and lockfile inspection
          - [ ] GitHub Actions workflow security review
          - [ ] Environment handling and secrets management
          - [ ] Client-server API boundary analysis
          - [ ] Authentication and authorization flow analysis
          - [ ] Input validation and output encoding review
          - [ ] Dependency vulnerability scanning
          - [ ] Build and lint validation
          
          ## Recommendations
          
          Based on the comprehensive security review:
          1. Address all HIGH severity findings immediately
          2. Plan remediation for MEDIUM severity findings in the next sprint
          3. Implement LOW severity recommendations for defense-in-depth
          4. Continue regular security audits using this agent
          5. Keep dependencies updated regularly
          6. Enable automated security scanning (CodeQL, secret scanning, dependency auditing)
          7. Implement pre-commit hooks for secret detection
          8. Maintain CODEOWNERS file for access control
          
          ## Assumptions and Limitations
          
          - Review conducted by security-reviewer agent at `${{ github.ref }}`
          - Analysis focuses on the specified review focus: `${{ steps.pr_info.outputs.review_focus || 'all security aspects' }}`
          - Some findings may require additional context or verification
          - This review is a snapshot in time and should be repeated regularly
          
          ---
          *This report was generated by the security-reviewer agent (.github/agents/security-reviewer.agent.md)*
          *For detailed findings and recommendations, refer to the agent analysis*
          EOF
          
          cat security-report.md

      - name: Comment security review on PR
        if: always() && steps.pr_info.outputs.pr_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = ${{ steps.pr_info.outputs.pr_number }};
            
            if (!prNumber) {
              console.log('No PR number available. Skipping PR comment.');
              return;
            }
            
            let report = '';
            try {
              report = fs.readFileSync('security-report.md', 'utf8');
            } catch (e) {
              report = '## 🔒 Security Review\n\nSecurity review completed by security-reviewer agent. Check workflow logs and artifacts for detailed findings.';
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: report
            });

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-report
          path: |
            security-report.md
            security-review-prompt.md
          retention-days: 30

      - name: Print workflow summary
        if: always()
        run: |
          echo "## 🔒 Security Review Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository**: ${{ steps.pr_info.outputs.repo }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ steps.pr_info.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Review Focus**: ${{ steps.pr_info.outputs.review_focus || 'All security aspects' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Agent**: `.github/agents/security-reviewer.agent.md`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Review Details**:" >> $GITHUB_STEP_SUMMARY
          echo "- Trust boundaries and API security" >> $GITHUB_STEP_SUMMARY
          echo "- Authentication and authorization" >> $GITHUB_STEP_SUMMARY
          echo "- Input validation and injection prevention" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets and credential management" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency vulnerability analysis" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions security" >> $GITHUB_STEP_SUMMARY
          echo "- Data privacy and exposure risks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for the complete security report." >> $GITHUB_STEP_SUMMARY
